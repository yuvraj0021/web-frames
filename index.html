<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apogee</title>
  <link href="https://db.onlinewebfonts.com/c/13ab13418f633c1b0516fed6e30bedbc?family=Suisse+Int%27l" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Suisse Intl', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button,
    a {
      font: inherit;
    }

    button {
      border: 0;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-down {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-left {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes fade-right {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes fade-scale {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes bar-grow {
      from { transform: scaleY(0); opacity: 0; }
      to   { transform: scaleY(1); opacity: 1; }
    }

    .animate-fade-up {
      animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-fade-down {
      animation: fade-down 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-fade-left {
      animation: fade-left 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-fade-right {
      animation: fade-right 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-fade-scale {
      animation: fade-scale 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-bar-grow {
      animation: bar-grow 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .opacity-0 {
      opacity: 0;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #080A19;
      color: white;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .nav {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 50;
    }

    .animated {
      opacity: 0;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
    }

    .wordmark {
      color: white;
      font-size: 22px;
      font-weight: 450;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .desktop-nav {
      height: 52px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 30px;
      background: rgba(10, 7, 7, 0.35);
      border-radius: 11px;
      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);
    }

    .desktop-nav-item {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: 450;
      line-height: 14px;
      cursor: pointer;
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    .desktop-nav-item:hover {
      color: white;
    }

    .platform-button {
      display: flex;
      align-items: center;
      gap: 5px;
      background: transparent;
    }

    .chevron {
      width: 10px;
      height: 10px;
      opacity: 0.8;
      flex: 0 0 auto;
    }

    .auth-pill {
      height: 52px;
      padding: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 13px;
      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);
    }

    .auth-button {
      height: 46px;
      padding: 0 24px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 450;
      line-height: 14px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .login-button {
      color: white;
      background: transparent;
    }

    .login-button:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .demo-button {
      color: #0A0707;
      background: #E9E9E9;
    }

    .demo-button:hover {
      background: white;
    }

    .mobile-menu-button {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 11px;
      background: rgba(10, 7, 7, 0.35);
      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .mobile-menu-button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .icon-stack {
      position: relative;
      width: 20px;
      height: 20px;
    }

    .menu-icon,
    .close-icon {
      position: absolute;
      inset: 0;
      width: 20px;
      height: 20px;
      color: white;
      transition: all 300ms ease-out;
    }

    .menu-icon {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    .close-icon {
      opacity: 0;
      transform: rotate(-90deg) scale(0.75);
    }

    .mobile-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      visibility: hidden;
      transition: all 500ms cubic-bezier(0.32, 0.72, 0, 1);
    }

    .mobile-overlay.open {
      visibility: visible;
    }

    .mobile-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 10, 25, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      opacity: 0;
      transition: opacity 500ms ease;
    }

    .mobile-overlay.open .mobile-backdrop {
      opacity: 1;
    }

    .mobile-panel {
      position: absolute;
      top: 76px;
      left: 16px;
      right: 16px;
      padding: 24px;
      background: rgba(17, 16, 15, 0.6);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      opacity: 0;
      transform: translateY(-16px) scale(0.97);
      transform-origin: top;
      transition: all 500ms cubic-bezier(0.32, 0.72, 0, 1);
    }

    .mobile-overlay.open .mobile-panel {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .mobile-links {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mobile-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 18px;
      font-weight: 450;
      text-decoration: none;
      opacity: 0;
      transform: translateX(-12px);
      transition:
        background-color 300ms ease,
        opacity 300ms ease,
        transform 300ms ease;
    }

    .mobile-overlay.open .mobile-link {
      opacity: 1;
      transform: translateX(0);
    }

    .mobile-link:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .mobile-link-chevron {
      width: 16px;
      height: 16px;
      opacity: 0.5;
    }

    .mobile-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 20px 0;
    }

    .mobile-ctas {
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transform: translateY(8px);
      transition:
        opacity 300ms ease,
        transform 300ms ease;
    }

    .mobile-overlay.open .mobile-ctas {
      opacity: 1;
      transform: translateY(0);
    }

    .mobile-cta {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 450;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .mobile-demo {
      color: #0A0707;
      background: #E9E9E9;
    }

    .mobile-demo:hover {
      background: white;
    }

    .mobile-login {
      color: white;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .mobile-login:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .hero-body {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 32px 20px;
    }

    .hero-row {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .copy-column {
      max-width: 593px;
    }

    .headline {
      color: white;
      font-size: 36px;
      font-weight: 400;
      line-height: 0.95;
      margin-bottom: 20px;
    }

    .subheadline {
      color: rgba(255, 255, 255, 0.8);
      font-size: 16px;
      font-weight: 450;
      line-height: 1.3;
      max-width: 370px;
      margin-bottom: 28px;
    }

    .hero-ctas {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-button {
      height: 46px;
      padding: 0 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 450;
      line-height: 15.5px;
      cursor: pointer;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    .hero-button.primary {
      background: #E9E9E9;
      color: #0A0707;
    }

    .hero-button.primary:hover {
      opacity: 0.9;
    }

    .hero-button.secondary {
      background: transparent;
      border: 1px solid white;
      color: white;
    }

    .hero-button.secondary:hover {
      opacity: 0.8;
    }

    .revenue-wrapper {
      width: 100%;
      max-width: 405px;
      margin: 0 auto;
    }

    .revenue-card {
      width: 100%;
      padding: 20px 20px 20px;
      border-radius: 24px;
      background: rgba(17, 16, 15, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .revenue-label {
      color: white;
      font-size: 16px;
      font-weight: 450;
      line-height: 20px;
      margin-bottom: 12px;
    }

    .amount {
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .amount-main,
    .amount-cents {
      font-size: 28px;
      font-weight: 450;
      line-height: 1;
    }

    .amount-main {
      color: white;
    }

    .amount-cents {
      color: rgba(255, 255, 255, 0.2);
    }

    .delta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .delta-badge {
      padding: 7px 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      color: white;
      font-size: 12px;
      font-weight: 450;
      line-height: 14px;
    }

    .delta-caption {
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      font-weight: 450;
      line-height: 14px;
      opacity: 0.7;
    }

    .chart {
      position: relative;
    }

    .bars {
      height: 80px;
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
    }

    .bar {
      flex: 1;
      min-width: 0;
      border-radius: 0.5px;
      transform-origin: bottom;
    }

    .gridlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .gridline {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .time-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
    }

    .time-label {
      color: rgba(255, 255, 255, 0.8);
      font-size: 9px;
      font-weight: 450;
      line-height: 10px;
    }

    @media (min-width: 640px) {
      .nav {
        padding: 30px 32px 0;
      }

      .hero-body {
        padding-left: 32px;
        padding-right: 32px;
      }

      .logo-icon {
        width: 32px;
        height: 32px;
      }

      .wordmark {
        font-size: 26px;
      }

      .headline {
        font-size: 52px;
        margin-bottom: 32px;
      }

      .subheadline {
        font-size: 18px;
        margin-bottom: 40px;
      }

      .hero-ctas {
        gap: 16px;
      }

      .hero-button {
        height: 51px;
        padding-left: 27px;
        padding-right: 27px;
        font-size: 15.5px;
      }

      .revenue-card {
        padding: 32px 32px 24px;
        border-radius: 33px;
      }

      .revenue-label {
        font-size: 20px;
        margin-bottom: 16px;
      }

      .amount {
        margin-bottom: 12px;
      }

      .amount-main,
      .amount-cents {
        font-size: 46px;
      }

      .delta-row {
        margin-bottom: 32px;
      }

      .delta-badge,
      .delta-caption {
        font-size: 14px;
        line-height: 14px;
      }

      .bars {
        height: 100px;
      }

      .time-label {
        font-size: 10px;
      }

      .mobile-panel {
        top: 86px;
        left: 24px;
        right: 24px;
        padding: 32px;
      }
    }

    @media (min-width: 768px) {
      .nav {
        padding-left: 82px;
        padding-right: 82px;
      }

      .hero-body {
        padding-left: 82px;
        padding-right: 82px;
      }

      .headline {
        font-size: 64px;
      }

      .subheadline {
        font-size: 20px;
      }
    }

    @media (min-width: 1024px) {
      .mobile-menu-button,
      .mobile-overlay {
        display: none;
      }

      .desktop-nav,
      .auth-pill {
        display: flex;
      }

      .hero-row {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 48px;
      }

      .revenue-wrapper {
        margin: 0;
      }

      .headline {
        font-size: 72px;
      }
    }

    @media (max-width: 1023px) {
      .desktop-nav,
      .auth-pill {
        display: none;
      }

      .mobile-menu-button {
        display: flex;
      }
    }

    @media (min-width: 1024px) {
      .mobile-menu-button {
        display: none;
      }
    }

    @media (max-height: 700px) and (min-width: 1024px) {
      .hero-body {
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .headline {
        font-size: 64px;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <video
      class="hero-video"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260813_092641_de52eb87-daf2-41db-92cb-7a56eae012a5.mp4"
      autoplay
      loop
      muted
      playsinline
    ></video>

    <div class="hero-content">
      <nav class="nav">
        <div class="animated animate-fade-down" style="animation-delay: 0ms;">
          <div class="logo-wrap">
            <svg
              class="logo-icon"
              width="28"
              height="28"
              viewBox="0 0 256 256"

            >

              />
            </svg>
            <span class="wordmark">Apogee</span>
          </div>

        <div class="animated animate-fade-down" style="animation-delay: 100ms;">
          <div class="desktop-nav">

                <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <span class="desktop-nav-item">Pricing</span>

          <button
            class="mobile-menu-button"
            id="menuButton"

          >
            <div class="icon-stack">
              <svg class="menu-icon" id="menuIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <svg class="close-icon" id="closeIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

                <span class="delta-caption">vs. previous period ($10.7M)</span>

              <div class="chart">
                <div class="bars" id="bars"></div>

                <div class="gridlines">
                  <div class="gridline" style="left: 20%;"></div>
                  <div class="gridline" style="left: 40%;"></div>
                  <div class="gridline" style="left: 60%;"></div>
                  <div class="gridline" style="left: 80%;"></div>

                </div>

                <div class="time-axis">

                  <span class="time-label" style="opacity: 1;">14:00</span>
                  <span class="time-label" style="opacity: 0.4;">16:00</span>

                </div>
              </div>

          </div>
        </div>

    </div>
  </section>

  <script>
    const BAR_HEIGHTS = [
      23, 40, 53, 40, 33, 14, 7, 17, 75, 65,
      88, 75, 65, 47, 33, 88, 4, 7, 9, 14,
      95, 65, 79, 37, 7, 40, 17, 20, 62, 47,
      92, 72
    ];

    const maxHeight = Math.max(...BAR_HEIGHTS);

    const barsContainer = document.getElementById('bars');

    BAR_HEIGHTS.forEach((h, i) => {
      const isProjected = i >= 28;
      const heightPercent = (h / maxHeight) * 100;

      const bar = document.createElement('div');
      bar.className = 'bar animate-bar-grow';
      bar.style.height = `${heightPercent}%`;
      bar.style.backgroundColor = isProjected
        ? 'rgba(255,255,255,0.1)'
        : 'white';
      bar.style.animationDelay = `${1100 + i * 30}ms`;

      barsContainer.appendChild(bar);
    });

    const menuButton = document.getElementById('menuButton');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const mobileBackdrop = document.getElementById('mobileBackdrop');
    const menuIcon = document.getElementById('menuIcon');
    const closeIcon = document.getElementById('closeIcon');
    const mobileLinks = document.querySelectorAll('.mobile-link');
    const mobileCtas = document.querySelector('.mobile-ctas');

    let isOpen = false;

    function setMenuState(open) {
      isOpen = open;

      menuButton.setAttribute('aria-expanded', String(isOpen));
      mobileOverlay.setAttribute('aria-hidden', String(!isOpen));

      if (isOpen) {
        document.body.style.overflow = 'hidden';
        mobileOverlay.classList.add('open');

        menuIcon.style.opacity = '0';
        menuIcon.style.transform = 'rotate(90deg) scale(0.75)';

        closeIcon.style.opacity = '1';
        closeIcon.style.transform = 'rotate(0deg) scale(1)';

        mobileLinks.forEach((link, i) => {
          link.style.transitionDelay = `${100 + i * 50}ms`;
        });

        mobileCtas.style.transitionDelay = '350ms';
      } else {
        document.body.style.overflow = '';
        mobileOverlay.classList.remove('open');

        menuIcon.style.opacity = '1';
        menuIcon.style.transform = 'rotate(0deg) scale(1)';

        closeIcon.style.opacity = '0';
        closeIcon.style.transform = 'rotate(-90deg) scale(0.75)';

        mobileLinks.forEach(link => {
          link.style.transitionDelay = '0ms';
        });

        mobileCtas.style.transitionDelay = '0ms';
      }
    }

    menuButton.addEventListener('click', () => {
      setMenuState(!isOpen);
    });

    mobileBackdrop.addEventListener('click', () => {
      setMenuState(false);
    });

    mobileLinks.forEach(link => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        setMenuState(false);
      });
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 1024 && isOpen) {
        setMenuState(false);
      }
    });

    window.addEventListener('beforeunload', () => {
      document.body.style.overflow = '';
    });
  </script>
</body>
</html>
